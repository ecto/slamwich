[package]
name = "slamwich"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "3D LiDAR SLAM: GICP scan matching, pose graph optimization, loop closure"
repository = "https://github.com/muni-hq/slamwich"
keywords = ["slam", "lidar", "robotics", "mapping", "localization"]
categories = ["science::robotics", "algorithms"]

[dependencies]
nalgebra = "0.33"
thiserror = "2"
tracing = "0.1"
kiddo = "5"
serde = { version = "1", features = ["derive"] }
bincode = "1"

[dev-dependencies]
approx = "0.5"
tracing-subscriber = "0.3"
